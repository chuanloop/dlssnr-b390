[Int4Mixed]
; int4 mixed: part of the network runs in int4 and other lower precisions; faster, the picture differs somewhat.
; Edits take effect when saved, also in game. A switch builds the other network in the background; until it is
; ready the current one keeps running.
; This version needs [Network] ACO Mode = 1 for int4 mixed; a change of ACO Mode takes effect after a game restart.

Enabled = 1
; 1 = int4 mixed (default)
; 0 = the default network
; With Enabled = 0 and no Hotkey when the game starts, int4 mixed cannot be switched to in that run (restart the game)

Hotkey = Ctrl+F11
; Switches between int4 mixed and the default network in game, to compare them on the same picture.
; Switching to int4 mixed with it needs [Network] ACO Mode = 1; with ACO Mode = 0 the default network stays.
; For the current run only, not written back to this file. Empty = no hotkey. Ctrl, Shift, Alt and one key,
; e.g. Alt+F9

KeepBoth = 0
; 0 = after a switch the other network is freed, so only one takes video memory; switching back builds it again
;     in the background (default)
; 1 = both networks stay in video memory and switching is instant, for comparing back and forth; takes one
;     more network's video memory

Sound = 1
; a short sound when it switches (hotkey or this file): two notes going up = int4 mixed, going down = the
; default network. 0 = silent

[Preprocess]
; Changes the picture the NR network is shown (exposure, display curve, contrast, saturation),
; and so how NR edits the picture.
; Two uses:
;   - a personal look, in any game: change the settings below. It departs from the original look;
;     it may be better or worse.
;   - games that do not hand their exposure to the upscaler: NR gets a picture several stops too
;     dark and turns it green and grainy (007 First Light); turning it on fixes that.
; Values marked [upstream] are the same as off; with every value at [upstream] nothing runs.
; Numbers may have decimals.
; The first time it is turned on (the hotkey too) NR rebuilds, and a second or two of frames
; go without NR.

Enabled = 0
; 0 = off, nothing runs (default)
; 1 = on, starting from auto exposure and the filmic curve. Hotkey also switches it for this
;     run, without writing this file

Exposure = auto
; off   = no exposure change [upstream] (the game's exposure when it gives one, else a fixed white point)
; auto  = auto exposure after Unreal Engine's design: adjusts to the picture's brightness, up or
;         down, and follows scene changes smoothly. For games that give no exposure, such as 007
;         First Light. When a game gives its exposure properly and you want your own colour look,
;         use off, not auto
; fixed = no automatic change; ExposureBias alone

ExposureBias = 0.00
; exposure compensation in EV (stops), -8 .. +8. 0 = none [upstream]
; every stop is a factor of 2: +1 = the network sees it twice as bright, -1 = half
; fixed: the whole gain, the same every frame
; auto:  added to what auto works out; the sum is the gain. Auto +4.5 with ExposureBias = 0.5 =
;        5 stops up
; off:   unused

Curve = filmic
; the display curve of the picture the NR network is shown. Test the effect yourself; the hotkey
; compares on the same picture
; none = no change [upstream], neutral, reinhard, filmic, gt, aces, agx

Contrast = 1.00
; contrast of the picture the NR network is shown, about mid grey, 0.5 .. 2. 1.0 = no change
; [upstream]

Saturation = 1.00
; saturation of the picture the NR network is shown, 0.05 .. 2 (not 0). 1.0 = no change [upstream]

Hotkey = Ctrl+F10
; switches the whole preprocess on and off in the game (flips Enabled for this run), to compare
; on the same picture. Never written to this file. Empty = no hotkey. Ctrl, Shift, Alt and one
; key, e.g. Alt+F9

Sound = 1
; a short sound when it switches (hotkey or this file): two notes going up = on, going down = off.
; 0 = silent

[Network]
; Which model the network runs and which compiler makes its machine code. Takes effect when the game restarts.

Model = small
; small    = the new model (the default model of NVIDIA's 310.9.16, faster)
; original = the old model (the model of 310.8.0)
; The new model's weights come from the 310.9.16 nvngx_dlssnr.dll (install.ps1); without them the old model
; runs and dlssnr-b390.log says why. int4 mixed exists for the old model only; with Model = small it is not used.

ACO Mode = 0
; 0 = the AMD driver's own compiler (default)
; 1 = machine code made by the ACO compiler (the one the Linux version uses). When it cannot be used, 0 is
;     used instead and dlssnr-b390.log says why

[RenoDX]
; RenoDX style: the processing around NR (how the picture is handed to NR and how NR's result is put back) follows RenoDX's DLSS5 add-on
; v8.5.0-rc10, with its own shaders (MIT). The NR network itself is the same.
; With the RenoDX style on, every NR setting is in this section (End in game opens NR Control to change them); the NR settings in the OptiScaler menu
; and in [DlssNr] have no effect, OptiScaler only does upscaling and frame generation; off (Enabled = 0), everything is as before.
; The keys other than Enabled keep RenoDX's names, defaults and ranges; a value out of range is taken as the default.
; Enabled applies after a game restart; the other keys apply when saved, also in game.

Enabled = 0
; 0 = off, no RenoDX processing (default)
; 1 = on

NeuralUplift = 1
; 1 = NR on (default); 0 = off, the picture passes through unchanged

NRToggleKey = F6
; hotkey that switches NR on / off in game (for the current run only, not written back), default F6; empty = none

NRHookPoint = 0
; OptiScaler route only: where NR runs. 0 = after the upscaler (default); 1 = before the upscaler (after it when the game
; uses Ray Reconstruction); 2 = Present (where the ReShade routes run; taken as 0 on the OptiScaler route)

; the network's own settings (pass 1)

NRIntensity = 1.00
; 0 .. 2, default 1. Strength of the enhancement

NRStyle = 0
; 0 = Standard (default); 1 = Natural; 2 = Cinematic

NRLocalTone = 1.00
; 0 .. 2, default 1. Local tone

NRLocalStructure = 1.00
; 0 .. 2, default 1. Local structure

NRSkinStructure = -1.00
; -1 .. 1, default -1 (unchanged). Structure on skin, only with NRAutoMask = 1

NRAutoMask = 0
; 1 = automatic mask (Character mask): skin is found and treated on its own; 0 = off (default)

NRSkinIndependent = 1
; 1 = with the automatic mask on, skin follows only NRSkinStructure, not NRLocalStructure; NRLocalStructure then reaches
; the network as at most 1 (above 1 the network ignores the skin setting) (default); 0 = both values go to the network as they are

; Passes (stacking): how many times the network runs a frame; each pass hands the previous pass's result to the network again and puts it back with this pass's strength.
; Every pass costs one more network run; the frame rate drops noticeably.

NRPasses = 1
; 1 .. 4, default 1; 1 .. 30 with NRUnlockPasses = 1
NRUnlockPasses = 0
; 1 = NRPasses may go above 4, up to 30 (as OptiScaler's UnlockPasses; RenoDX itself stops at 4); passes 5 and later take pass 4's settings.
; Every pass runs the network once more, which lowers the frame rate a lot. 0 = off (default)

NRChainedHistory = 1
; 1 = from pass 2 on every pass keeps its own history, restarted only on scene cuts and the like (default); 0 = from pass 2 on, every frame starts afresh
; (RenoDX's diagnostic mode, may flicker, for comparison only)

; settings of passes 2, 3 and 4 (passes after 4 use pass 4's):
; Transfer / Color: how strongly this pass is put back, as NRTransferStrength / NRColorStrength, 0 .. 1, default 1;
; Intensity: this pass's strength of the enhancement, 0 .. 2, default 1;
; FollowPass1: 1 = this pass's network settings are pass 1's (default); 0 = this pass's own Style / LocalTone / Structure /
; Skin / AutoMask (meaning as for pass 1 above)

NRPass2Transfer = 1.00
NRPass2Color = 1.00
NRPass2Intensity = 1.00
NRPass2FollowPass1 = 1
NRPass2Style = 0
NRPass2LocalTone = 1.00
NRPass2Structure = 1.00
NRPass2Skin = -1.00
NRPass2AutoMask = 0

NRPass3Transfer = 1.00
NRPass3Color = 1.00
NRPass3Intensity = 1.00
NRPass3FollowPass1 = 1
NRPass3Style = 0
NRPass3LocalTone = 1.00
NRPass3Structure = 1.00
NRPass3Skin = -1.00
NRPass3AutoMask = 0

NRPass4Transfer = 1.00
NRPass4Color = 1.00
NRPass4Intensity = 1.00
NRPass4FollowPass1 = 1
NRPass4Style = 0
NRPass4LocalTone = 1.00
NRPass4Structure = 1.00
NRPass4Skin = -1.00
NRPass4AutoMask = 0

; how NR's result is put back into the picture

NRColorStrength = 1.00
; 0 .. 1, default 1. Float HDR pictures: how much of NR's change is used (0 = the original picture); SDR and HDR10 pictures: how much of NR's colour is used
; (0 = only NR's change of brightness)

NRTransferStrength = 1.00
; 0 .. 1, default 1. Strength of NR's change on HDR10 pictures, and of the HDR shadow restore

NRChromaClamp = 1.00
; 0.25 .. 2 stops, default 1. How far NR may change a colour on HDR pictures

NRTransferMode = 0
; HDR pictures: 0 = by the ratio before / after NR only (default); 1 = also compensated by the slope of the display curve, less of the change is lost in bright areas

NRStyleHighlightGuard = 0.00
; 0 .. 2 stops, default 0 (off). How far NR may darken highlights on HDR pictures

NRDetailStability = 0
; smooths NR's change over time along the motion vectors, less flickering detail: 0 = auto (on after the upscaler with motion vectors, default); 1 = off; 2 = always on

NRResolutionScale = 1.00
; the NR network's resolution, 0.33 .. 1 of the picture, default 1. Below 1 the network is faster; the change is enlarged back to the picture by NRLookUpsample below

NRFollowInputRes = 0
; 1 = the NR network runs at the game's render resolution (the motion vectors' resolution) instead of NRResolutionScale; 0 = off (default)

NRLookUpsample = 0
; with the network below the picture's resolution, how the change is enlarged back: 0 = auto (edge-aware, default); 1 = edge-aware; 2 = classic (plain enlargement);
; 3 = edge-aware, with SDR pictures reduced by area for the network (a change restarts the network's history)

NRLookMode = 0
; RenoDX's Adjust NR's look: adjusts how much NR changed, directly on its result; changes apply at once, the network does not restart.
; 1 = on, the NRLook* keys below apply; 0 = off, NR's result is used as it is (default). Every NRLook* default leaves the result as it is

NRLookStrength = 1.00
; 0 .. 2, default 1. NR's whole change (in stops): 0 = removed, 1 = kept, 2 = doubled

NRLookBrighten = 1.00
; 0 .. 2, default 1. How much of NR's brightening is kept: 0 = none, 2 = doubled

NRLookDarken = 1.00
; 0 .. 2, default 1. How much of NR's darkening is kept (including the dark halos it leaves around bright objects)

NRLookColour = 1.00
; 0 .. 2, default 1. How far NR moves colours towards or away from grey: 0 = keep the game's saturation, 2 = doubled

NRLookHue = 1.00
; 0 .. 2, default 1. How far NR turns hues (colour casts): 0 = keep the game's hues

NRLookShadows = 1.00
; 0 .. 2, default 1. Multiplier of the change in the game picture's dark areas

NRLookMidtones = 1.00
; 0 .. 2, default 1. Multiplier of the change in midtones

NRLookHighlights = 1.00
; 0 .. 2, default 1. Multiplier of the change in bright areas

NRLookMaxBrighten = 0.00
; 0 .. 4 stops, default 0 (no limit). How far NR may brighten a pixel (soft limit)

NRLookMaxDarken = 0.00
; 0 .. 4 stops, default 0 (no limit). How far NR may darken a pixel (soft limit)

NRLookMaxColour = 0.00
; 0 .. 2 stops, default 0 (no limit). How far NR may change a colour (soft limit)

NRLookTone = 1.00
; 0 .. 2, default 1. Multiplier of NR's broad lighting changes (fine ones: NRLookDetail)

NRLookDetail = 1.00
; 0 .. 2, default 1. Multiplier of NR's fine detail changes

NRLookDetailRadius = 1.00
; 0.25 .. 4, default 1. Where broad turns into fine, in percent of the network picture's height

NRLookHalo = 0.00
; 0 .. 1, default 0. Weakens the dark halos NR leaves beside bright objects; even darkening of whole areas and shadows beside dark objects stay.
; The larger NRLookDetailRadius, the wider the halos it handles

NRLookHaloBrightSide = 0.00
; 0 .. 1, default 0. Weakens the soft dark edge NR leaves on the brighter side of dark objects (deeper with every pass)

NRLookStabilize = 0
; smooths NR's broad changes over time: 0 = off (default); 1 = static (for still pictures); 2 = along the motion vectors.
; When on, it replaces NRDetailStability; lighting changes lag slightly

NRLookStabilizeMs = 60
; 10 .. 250 ms, default 60. How long the smoothing remembers: longer is steadier and follows lighting changes more slowly

NRLookStabilizeDetail = 0
; 1 = fine detail is smoothed too; 0 = broad changes only (default)

NRSdrBlackRestore = 0
; SDR pictures, taking back NR's lift in dark areas: 0 = near-black areas only (default); 1 = all areas; 2 = as 0, with a smooth transition at the threshold

NRDisplayPedestal = 0
; HDR pictures, shadow restore: 0 = auto (none on float HDR, default); 1 = always; 2 = as 0, with a smooth transition at the threshold

NRCodecMode = 2
; HDR encoding: 0 = classic; 1 = anchored; 2 = auto (default); 3 = display

NRNeuralFloorGuard = 1
; 1 = protects colours where NR's result is near black (default); 0 = off

; the picture's encoding and brightness

NRSourceEncoding = 0
; what the picture's values mean: 0 = from the format (default); 1 = SDR; 2 = linear light; 3 = PQ

NRLinearUnitNits = 0.0
; 0 .. 10000, default 0. Above 0, float pictures are taken in absolute units: 1.0 = this many nits

NRProxyAnchor = 4.00
; 0.5 .. 32 nits, default 4. Encoding anchor of absolute-unit HDR

NRPaperWhiteScale = 2.5375
; 0.005 .. 16, default 2.5375 (203/80)

NRDiffuseWhiteNits = 203.0
; 80 .. 1000, default 203. Diffuse white of PQ pictures

NRPQCalibration = 1.000
; 0.005 .. 16, default 1

NRFeedMode = 0
; what float HDR pictures are divided by before NR: 0 = auto (the game's exposure when it hands over a readable exposure texture without AutoExposure,
; range-checked, otherwise computed from the picture, default); 1 = always computed from the picture; 2 = always the game's exposure (1 without a texture)
; The ReShade routes have no game exposure and always compute it from the picture

NRPresentEncoding = 0
; ReShade routes only: the picture's encoding. 0 = from the swap chain's colour space (default); 1 = SDR; 2 = HDR10; 3 = scRGB

NRPresentWhiteNits = 0.0
; HDR pictures on the ReShade routes only: diffuse white in nits. 0 = auto (default; a RenoDX mod's Game Brightness,
; Windows' SDR content brightness, NRDiffuseWhiteNits, in this order)

NRPresentWhiteSource = 0
; ReShade routes only: 0 = auto (default); 1 = do not take a RenoDX mod's Game Brightness

NRNormGovernor = 2
; how the automatic divisor of relative-unit HDR follows the picture: 0 = taken every frame as it is; 1 = rate-limited every frame; 2 = steady (default)

NRNormCutAware = 1
; 1 = the automatic divisor restarts at once on the game's scene cuts (Reset) (default); 0 = off

NRNormAttackStops = 4.00
; 0.1 .. 64, default 4. In steady mode, how many stops a second the divisor may grow (the picture NR sees gets darker)

NRNormReleaseStops = 0.50
; 0.05 .. 16, default 0.5. In steady mode, how many stops a second the divisor may shrink

NRNormSlewStops = 0.020
; 0 .. 0.5, default 0.02. In rate-limited mode, how many stops a frame at most

; depth and motion vectors

NRPresentGuides = 0
; ReShade routes only: 0 = motion vectors (DLSS5_Feed) when there are some, neutral ones (no motion, no depth) otherwise, NR runs either way (default);
; 1 = no NR without motion vectors; 2 = always neutral ones (games whose motion vectors are not used)

NRDepthMode = 0
; depth direction: 0 = by the game's flag (default); 1 = taken as normal depth; 2 = taken as reversed depth

NRMVecScaleX = 1.000
; -2 .. 2, default 1. Multiplier of the game's motion vectors in X (for games that hand over wrong ones)

NRMVecScaleY = 1.000
; -2 .. 2, default 1. Multiplier of the game's motion vectors in Y

; screenshots: the same frame without and with NR (RenoDX's NR screenshot), saved to the NR Screenshots folder in the game folder

NRScreenshotKey = F5
; screenshot hotkey, default F5; empty = none (NR Control has a screenshot button too)

NRScreenshotSource = 0
; what is captured: 0 = auto (default, as 1); 1 = the final picture (on the ReShade routes the picture sent to the display; on the OptiScaler route
; NR moves to OptiScaler's finished picture for one frame); 2 = the model's input and output (for diagnosis, without the game's tone mapping and UI)

NRScreenshotFormat = 0
; 0 = PNG (default, lossless; HDR as 16-bit PQ, kept HDR); 1 = JPEG; 2 = both

NRScreenshotLayout = 0
; 0 = two pictures (default); 1 = also a side-by-side picture (left NR off, right NR on)

NRScreenshotJpegQuality = 95
; 80 .. 100, default 95. JPEG quality

NRScreenshotMaxMB = 10
; 0 .. 500, default 10. Above this many MB a JPEG's quality is lowered (to 85 at the least, the picture is not scaled down); 0 = no limit

[Log]
; dlssnr-b390.log in the game folder. Takes effect when the game restarts.

Enabled = 1
; 1 = write the log (default)
; 0 = no log

ClearOnStart = 1
; 1 = clear the previous log at every game start (default)
; 0 = keep appending to the previous log
